<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Scarlet Book</title>
<style>
:root{--bg-base:#0B0B0E;--bg-surface:#14141A;--bg-card:#1C1C24;--border-color:#2D2D3B;--purple-primary:#A78BFA;--purple-deep:#4C1D95;--blue-accent:#38BDF8;--text-main:#E2E8F0;--text-muted:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg-base);color:var(--text-main);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{height:50px;background:var(--bg-surface);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;gap:8px}
.logo{font-size:1.1rem;font-weight:700;color:var(--purple-primary)}
.btn{background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-main);padding:6px 10px;border-radius:6px;font-size:.8rem;cursor:pointer}
.btn.on{border-color:var(--purple-primary);color:var(--purple-primary)}
.btn-purple{background:var(--purple-deep);border-color:var(--purple-primary);color:#fff}
.workspace{display:flex;flex:1;overflow:hidden;position:relative}
.sidebar{width:240px;background:var(--bg-surface);border-right:1px solid var(--border-color);display:flex;flex-direction:column;flex-shrink:0;z-index:50}
.sidebar-content{flex:1;overflow-y:auto;padding:10px}
.folder-item,.note-item{padding:8px;border-radius:6px;cursor:pointer;font-size:.85rem;margin-bottom:4px;color:var(--text-muted)}
.folder-item.active{color:var(--text-main);font-weight:600}
.note-item{padding-left:20px}
.note-item.active{background:var(--purple-deep);color:#fff}
.main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.note-header-bar{padding:8px 12px;background:var(--bg-surface);border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note-content-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{color:var(--purple-primary);font-size:1.4rem;outline:none}
h3{color:var(--blue-accent);font-size:1.1rem}
.formula-box{background:var(--bg-card);border:1px solid var(--purple-primary);padding:12px;border-radius:8px;text-align:center;font-family:monospace}
.editable-note{width:100%;flex:1;min-height:240px;background:transparent;border:none;color:var(--text-main);font-size:.95rem;resize:none;outline:none;line-height:1.5}
.ai-bottom-bar{background:var(--bg-surface);border-top:1px solid var(--border-color);padding:8px 12px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
.prompt-input-row{display:flex;gap:8px}
.prompt-input,.modal input{flex:1;background:var(--bg-card);border:1px solid var(--border-color);border-radius:6px;padding:8px 12px;color:#fff;outline:none;font-size:16px;min-width:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:1000;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:10px;width:100%;max-width:400px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tab-view-panel{display:none;flex-direction:column;gap:12px;flex:1}
.tab-view-panel.active{display:flex}
.flashcard-card{background:var(--bg-card);border:1px solid var(--border-color);padding:24px;border-radius:8px;text-align:center;min-height:140px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.q{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.q .btn{text-align:left}
.q .ok{border-color:#22c55e;color:#22c55e}.q .bad{border-color:#ef4444;color:#ef4444}
#menu-btn{display:none}
#status{font-size:.75rem;color:var(--text-muted)}
@media(max-width:700px){
 #menu-btn{display:inline-block}
 .sidebar{position:absolute;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}
 .sidebar.open{transform:none}
}
</style>
</head>
<body>
<header>
 <div style="display:flex;gap:8px;align-items:center">
  <button class="btn" id="menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="logo">Scarlet Book</div>
  <button class="btn" onclick="toggleTempChat()">Temp Chat</button>
 </div>
 <div style="display:flex;gap:6px">
  <button class="btn" onclick="readAudioOutLoud()">Read</button>
  <button class="btn" onclick="openSettingsModal()">Settings</button>
 </div>
</header>
<div class="workspace">
 <div class="sidebar" id="sidebar">
  <div style="padding:10px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center">
   <span>Folders</span>
   <div style="display:flex;gap:4px">
    <button class="btn" onclick="openModal('folder-modal')">+Folder</button>
    <button class="btn" onclick="openModal('note-modal')">+Note</button>
   </div>
  </div>
  <div style="padding:8px"><button class="btn btn-purple" style="width:100%" onclick="openQuizFolderView()">Quiz Folder</button></div>
  <div class="sidebar-content" id="folder-tree"></div>
 </div>
 <div class="main-panel">
  <div class="note-header-bar">
   <div style="font-size:.8rem;color:var(--text-muted)" id="current-breadcrumb"></div>
   <div style="display:flex;gap:6px">
    <button class="btn on" data-tab="formatted" onclick="switchNoteTab('formatted')">Notes</button>
    <button class="btn" data-tab="flashcards" onclick="switchNoteTab('flashcards')">Flashcards</button>
    <button class="btn" data-tab="quiz" onclick="switchNoteTab('quiz')">Quiz</button>
   </div>
  </div>
  <div class="note-content-area">
   <div id="view-formatted" class="tab-view-panel active">
    <h1 id="active-note-title" contenteditable="true" onblur="saveActiveTitle(this)"></h1>
    <div class="formula-box">Moles (n) = Mass (m) / Molar Mass (M)</div>
    <textarea class="editable-note" id="active-note-body" placeholder="Tap anywhere to edit notes..." oninput="saveBody(this)"></textarea>
   </div>
   <div id="view-flashcards" class="tab-view-panel">
    <h3>Flashcards</h3>
    <div class="flashcard-card" id="flashcard-display" onclick="flipCard()"></div>
    <div class="row" style="justify-content:center">
     <button class="btn" onclick="stepCard(-1)">◀ Prev</button>
     <span id="card-count" style="align-self:center;font-size:.8rem;color:var(--text-muted)"></span>
     <button class="btn" onclick="stepCard(1)">Next ▶</button>
    </div>
   </div>
   <div id="view-quiz" class="tab-view-panel">
    <h3 id="quiz-title">Quiz</h3>
    <div id="quiz-container"></div>
   </div>
  </div>
  <div class="ai-bottom-bar">
   <div class="row">
    <div style="display:flex;gap:4px">
     <button class="btn on" data-len="concise" onclick="setAiLength('concise')">Concise</button>
     <button class="btn" data-len="mid" onclick="setAiLength('mid')">Mid</button>
     <button class="btn" data-len="extended" onclick="setAiLength('extended')">Extended</button>
    </div>
    <div style="display:flex;gap:6px">
     <button class="btn" onclick="runAiAction('summarize')">Summarize</button>
     <button class="btn" onclick="runAiAction('flashcards')">+ Flashcards</button>
     <button class="btn" onclick="runAiAction('quiz')">+ Quiz</button>
    </div>
   </div>
   <div class="prompt-input-row">
    <input type="text" class="prompt-input" id="ai-prompt-box" placeholder="Ask AI regarding this note...">
    <button class="btn btn-purple" onclick="sendAiPrompt()">Ask AI</button>
   </div>
   <div id="status"></div>
  </div>
 </div>
</div>

<div class="modal-overlay" id="settings-modal"><div class="modal">
 <h3>Gemini Settings</h3>
 <input type="password" id="api-key-input" placeholder="Paste Gemini API Key...">
 <input type="text" id="model-input" placeholder="Model (e.g. gemini-2.5-flash)">
 <div style="display:flex;justify-content:flex-end;gap:6px">
  <button class="btn" onclick="closeModal('settings-modal')">Cancel</button>
  <button class="btn btn-purple" onclick="saveApiKey()">Save</button>
 </div>
</div></div>
<div class="modal-overlay" id="folder-modal"><div class="modal">
 <h3>New Folder</h3>
 <input type="text" id="new-folder-name" placeholder="Folder Name">
 <div style="display:flex;justify-content:flex-end;gap:6px">
  <button class="btn" onclick="closeModal('folder-modal')">Cancel</button>
  <button class="btn btn-purple" onclick="createFolder()">Create</button>
 </div>
</div></div>
<div class="modal-overlay" id="note-modal"><div class="modal">
 <h3>New Note</h3>
 <input type="text" id="new-note-title" placeholder="Note Title">
 <div style="display:flex;justify-content:flex-end;gap:6px">
  <button class="btn" onclick="closeModal('note-modal')">Cancel</button>
  <button class="btn btn-purple" onclick="createNote()">Create</button>
 </div>
</div></div>
<div class="modal-overlay" id="temp-chat-modal"><div class="modal" style="height:420px">
 <h3>Temp Chat</h3>
 <div id="temp-chat-messages" style="flex:1;overflow-y:auto;background:var(--bg-card);padding:8px;border-radius:6px;font-size:.85rem;display:flex;flex-direction:column;gap:6px"></div>
 <div style="display:flex;gap:6px">
  <input type="text" id="temp-chat-input" placeholder="Ask question...">
  <button class="btn btn-purple" onclick="sendTempMessage()">Send</button>
  <button class="btn" onclick="toggleTempChat()">Close</button>
 </div>
</div></div>

<script>
// ---------- Safe storage (works even if localStorage is blocked) ----------
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let appData = null;
try { appData = JSON.parse(store.get('scarlet_data')); } catch(e){}
if (!appData || !Array.isArray(appData.folders)) {
  appData = {
    folders: [{ id:'f-1', name:'Chemistry', notes:[{ id:'n-1', title:'Ionic Calculations', body:'Moles calculations.', flashcards:[], quiz:[] }] }],
    activeNoteId:'n-1', activeFolderId:'f-1'
  };
}
let apiKey = store.get('scarlet_key') || '';
let model = store.get('scarlet_model') || 'gemini-2.5-flash';
let aiLength = 'concise', cardIdx = 0, cardFlipped = false, folderQuizMode = false;

function save(){ store.set('scarlet_data', JSON.stringify(appData)); }
function status(t){ $('status').textContent = t || ''; }
function getNote(){
  for (const f of appData.folders) for (const n of f.notes) if (n.id === appData.activeNoteId) return n;
  return null;
}
function getFolderOf(id){ return appData.folders.find(f => f.notes.some(n => n.id === id)); }

function render(){
  const tree = $('folder-tree'); tree.innerHTML = '';
  appData.folders.forEach(f => {
    const fd = document.createElement('div');
    const fi = document.createElement('div');
    fi.className = 'folder-item' + (f.id === appData.activeFolderId ? ' active' : '');
    fi.textContent = '📁 ' + f.name;
    fi.onclick = () => { appData.activeFolderId = f.id; save(); render(); };
    fd.appendChild(fi);
    f.notes.forEach(n => {
      const nd = document.createElement('div');
      nd.className = 'note-item' + (n.id === appData.activeNoteId ? ' active' : '');
      nd.textContent = '📄 ' + n.title;
      nd.onclick = () => { appData.activeNoteId = n.id; appData.activeFolderId = f.id; folderQuizMode = false; cardIdx = 0; save(); render(); $('sidebar').classList.remove('open'); };
      fd.appendChild(nd);
    });
    tree.appendChild(fd);
  });
  const note = getNote();
  if (note) {
    const f = getFolderOf(note.id);
    $('current-breadcrumb').textContent = (f ? f.name : '') + ' / ' + note.title;
    if (document.activeElement !== $('active-note-title')) $('active-note-title').textContent = note.title;
    if (document.activeElement !== $('active-note-body')) $('active-note-body').value = note.body || '';
  } else {
    $('current-breadcrumb').textContent = 'No note selected';
    $('active-note-title').textContent = '';
    $('active-note-body').value = '';
  }
  renderCards(); renderQuiz();
}

function saveActiveTitle(el){ const n = getNote(); if (n){ n.title = el.innerText.trim() || 'Untitled'; save(); render(); } }
function saveBody(el){ const n = getNote(); if (n){ n.body = el.value; save(); } }

function switchNoteTab(t){
  document.querySelectorAll('.tab-view-panel').forEach(p => p.classList.remove('active'));
  $('view-' + t).classList.add('active');
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t !== 'quiz') folderQuizMode = false;
  renderQuiz();
}
function setAiLength(m){
  aiLength = m;
  document.querySelectorAll('[data-len]').forEach(b => b.classList.toggle('on', b.dataset.len === m));
}
function toggleSidebar(){ $('sidebar').classList.toggle('open'); }
function openModal(id){ $(id).classList.add('active'); const i = $(id).querySelector('input'); if (i) setTimeout(() => i.focus(), 50); }
function closeModal(id){ $(id).classList.remove('active'); }
function openSettingsModal(){ $('api-key-input').value = apiKey; $('model-input').value = model; openModal('settings-modal'); }
function saveApiKey(){
  apiKey = $('api-key-input').value.trim();
  model = $('model-input').value.trim() || 'gemini-2.5-flash';
  store.set('scarlet_key', apiKey); store.set('scarlet_model', model);
  closeModal('settings-modal');
}
function createFolder(){
  const name = $('new-folder-name').value.trim();
  if (!name) return;
  const f = { id:'f-' + Date.now(), name, notes:[] };
  appData.folders.push(f); appData.activeFolderId = f.id;
  $('new-folder-name').value = ''; save(); closeModal('folder-modal'); render();
}
function createNote(){
  const title = $('new-note-title').value.trim();
  if (!title) return;
  if (!appData.folders.length) appData.folders.push({ id:'f-1', name:'General', notes:[] });
  const f = appData.folders.find(x => x.id === appData.activeFolderId) || appData.folders[0];
  const n = { id:'n-' + Date.now(), title, body:'', flashcards:[], quiz:[] };
  f.notes.push(n); appData.activeNoteId = n.id; appData.activeFolderId = f.id;
  $('new-note-title').value = ''; save(); closeModal('note-modal'); render();
}
function toggleTempChat(){ $('temp-chat-modal').classList.toggle('active'); }
function readAudioOutLoud(){
  const n = getNote(); if (!n || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(n.title + '. ' + n.body));
}

// ---------- Flashcards ----------
function renderCards(){
  const n = getNote(), box = $('flashcard-display');
  const cards = n ? n.flashcards : [];
  if (!cards.length){ box.textContent = 'Tap + Flashcards below to generate.'; $('card-count').textContent = ''; return; }
  cardIdx = Math.min(Math.max(cardIdx, 0), cards.length - 1);
  const c = cards[cardIdx];
  box.textContent = cardFlipped ? c.a : c.q;
  $('card-count').textContent = (cardIdx + 1) + ' / ' + cards.length + (cardFlipped ? ' (answer)' : ' (question)');
}
function flipCard(){ cardFlipped = !cardFlipped; renderCards(); }
function stepCard(d){ const n = getNote(); if (!n || !n.flashcards.length) return; cardIdx = (cardIdx + d + n.flashcards.length) % n.flashcards.length; cardFlipped = false; renderCards(); }

// ---------- Quiz ----------
function renderQuiz(){
  const box = $('quiz-container'); box.innerHTML = '';
  let items = [];
  if (folderQuizMode){
    const f = appData.folders.find(x => x.id === appData.activeFolderId);
    $('quiz-title').textContent = 'Quiz Folder: ' + (f ? f.name : '');
    if (f) f.notes.forEach(n => items.push(...n.quiz));
  } else {
    $('quiz-title').textContent = 'Quiz';
    const n = getNote(); if (n) items = n.quiz;
  }
  if (!items.length){ box.innerHTML = '<p style="color:var(--text-muted)">No quiz questions yet. Tap + Quiz below to generate.</p>'; return; }
  items.forEach((q, qi) => {
    const d = document.createElement('div'); d.className = 'q';
    const t = document.createElement('div'); t.textContent = (qi + 1) + '. ' + q.q; d.appendChild(t);
    q.options.forEach((o, oi) => {
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = o;
      b.onclick = () => {
        d.querySelectorAll('button').forEach((x, xi) => { x.disabled = true; if (xi === q.answer) x.classList.add('ok'); });
        if (oi !== q.answer) b.classList.add('bad');
      };
      d.appendChild(b);
    });
    box.appendChild(d);
  });
}
function openQuizFolderView(){ folderQuizMode = true; switchNoteTab('quiz'); folderQuizMode = true; renderQuiz(); $('sidebar').classList.remove('open'); }

// ---------- Gemini ----------
async function callGemini(p){
  if (!apiKey){ openSettingsModal(); return null; }
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ contents:[{ parts:[{ text:p }] }] })
    });
    const d = await res.json();
    if (!res.ok) return 'Error: ' + (d.error?.message || res.status);
    return d.candidates?.[0]?.content?.parts?.[0]?.text || 'Error: empty response.';
  } catch(e){ return 'Error: ' + e.message + ' (check your internet connection)'; }
}
function parseJson(t){
  const m = t.replace(/```json|```/g, '').match(/\[[\s\S]*\]/);
  if (!m) throw new Error('bad json');
  return JSON.parse(m[0]);
}
const lenWord = () => ({ concise:'short', mid:'moderately detailed', extended:'detailed' }[aiLength]);

async function runAiAction(a){
  const n = getNote(); if (!n) return;
  const ctx = `Note title: ${n.title}\nNote content:\n${n.body}`;
  status('Working...');
  if (a === 'summarize'){
    const r = await callGemini(`Write a ${lenWord()} summary of this note.\n\n${ctx}`);
    if (r){ n.body += '\n\n--- Summary ---\n' + r; save(); render(); }
  } else if (a === 'flashcards'){
    const r = await callGemini(`Make ${aiLength==='concise'?5:aiLength==='mid'?8:12} flashcards from this note. Reply ONLY with a JSON array like [{"q":"...","a":"..."}].\n\n${ctx}`);
    if (r){ try { n.flashcards.push(...parseJson(r)); cardIdx = 0; cardFlipped = false; save(); render(); switchNoteTab('flashcards'); } catch(e){ status(r.startsWith('Error') ? r : 'Could not read AI response, try again.'); return; } }
  } else if (a === 'quiz'){
    const r = await callGemini(`Make ${aiLength==='concise'?4:aiLength==='mid'?6:10} multiple choice questions from this note. Reply ONLY with a JSON array like [{"q":"...","options":["A","B","C","D"],"answer":0}] where answer is the index of the correct option.\n\n${ctx}`);
    if (r){ try { n.quiz.push(...parseJson(r)); save(); render(); switchNoteTab('quiz'); } catch(e){ status(r.startsWith('Error') ? r : 'Could not read AI response, try again.'); return; } }
  }
  status();
}
async function sendAiPrompt(){
  const box = $('ai-prompt-box'), n = getNote();
  if (!box.value.trim() || !n) return;
  const q = box.value.trim(); box.value = ''; status('Thinking...');
  const r = await callGemini(`Answer in a ${lenWord()} way.\nNote title: ${n.title}\nNote content:\n${n.body}\n\nQuestion: ${q}`);
  if (r){ n.body += `\n\nQ: ${q}\nA: ${r}`; save(); render(); }
  status();
}
async function sendTempMessage(){
  const input = $('temp-chat-input'), c = $('temp-chat-messages');
  const q = input.value.trim(); if (!q) return;
  input.value = '';
  c.innerHTML += `<div>You: ${esc(q)}</div>`;
  const r = await callGemini(q);
  if (r) c.innerHTML += `<div style="color:var(--purple-primary)">AI: ${esc(r)}</div>`;
  c.scrollTop = c.scrollHeight;
}
$('ai-prompt-box').addEventListener('keydown', e => { if (e.key === 'Enter') sendAiPrompt(); });
$('temp-chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendTempMessage(); });

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname !== 'localhost') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
